<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C7CFA"/>
      <stop offset="1" stop-color="#364FC7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFD43B"/>
    </marker>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- 계단처럼 오르는 소득 -->
  <path d="M22 96 H40 V82 H58 V68 H76" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 절벽: 혜택이 한꺼번에 끊기는 지점 -->
  <path d="M76 68 V92 H96" fill="none" stroke="#FF8787" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 절벽을 넘어가는 자립 경로 -->
  <path d="M76 60 Q90 30 106 46" fill="none" stroke="#FFD43B" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 9" marker-end="url(#arrow)"/>
</svg>
