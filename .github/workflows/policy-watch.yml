name: 지자체 제도 변경 확인 (매일)

# 공공데이터포털 API는 새 정책 알림을 주지 않아서, 매일 최종 수정일을 비교해 바뀐 제도만 처리한다.
# 1) 바뀐 제도 원문 저장 + 3일 연속 사라진 제도 표시 → 2) AI 초안 → 3) '검토 대기' 초안 목록 갱신
# → 4) (설정했으면) Supabase에 검토 대기로 올리고 '폐지 의심' 표시 (자동 중지는 하지 않음)
# → 5) 기록을 auto/policy-updates 브랜치에 남기고 develop으로 PR. 담당자가 승인해야 계산에 들어간다.
#
# 저장소 Settings → Secrets and variables → Actions 에 넣을 값 (코드·채팅에 붙이지 않기)
#   DATA_GO_KR_KEY             공공데이터포털 일반인증키 (필수)
#   OPENAI_API_KEY             AI 초안 변환 (gpt-5). 없으면 ANTHROPIC_API_KEY(Claude), 둘 다 없으면 원문만 저장하고 키를 넣은 다음 날 이어서 변환
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   관리자 화면 DB에 바로 올릴 때 (없으면 PR만)
# 그리고 Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests" 켜기

on:
  schedule:
    - cron: "0 21 * * *" # 매일 오전 6시 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: policy-watch
  cancel-in-progress: false

jobs:
  watch:
    name: 바뀐 지자체 제도 확인
    runs-on: ubuntu-latest
    env:
      BRANCH: auto/policy-updates
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: 이전 확인 기록 이어받기
        run: |
          # 아직 합치지 않은 자동 수집 PR이 있으면 그 브랜치의 기록에서 이어서 확인한다
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            # develop에 새로 들어온 규칙·초안을 먼저 받아 와서, 오래된 파일로 초안을 다시 만들지 않게 한다
            git merge --no-edit origin/develop || { git merge --abort; echo "::warning::develop과 충돌해 합치지 못했습니다. 자동 수집 PR을 먼저 정리해 주세요."; }
          else
            git checkout -B "$BRANCH"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 파이썬 패키지 설치
        run: pip install "requests>=2.32" "openai>=1.60" "anthropic>=2.8"

      - name: 바뀐 제도 확인
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python pipeline/watch_updates.py

      - name: AI 초안 만들기 (초안이 아직 없는 원문만)
        continue-on-error: true # 실패해도 아래 '기록 남기기'는 실행 (그날 확인 기록이 사라지지 않게)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 키가 없으면 시도 횟수를 세지 않고 건너뛴다 (키를 넣은 다음 날 이어서 변환)
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::AI 키가 없어 AI 변환을 건너뜁니다 (원문은 저장, 다음 실행 때 다시 시도)"; exit 0; fi
          PENDING="$(python pipeline/watch_updates.py --pending)"
          if [ -z "$PENDING" ]; then echo "변환할 원문 없음"; exit 0; fi
          PROVIDER=claude; [ -n "$OPENAI_API_KEY" ] && PROVIDER=openai   # OpenAI 키가 있으면 gpt-5
          python pipeline/convert.py --provider "$PROVIDER" --only $PENDING --out pipeline/runs_watch_rules

      - name: 검토 대기 초안 목록 갱신
        run: |
          python pipeline/export_local_drafts.py
          node oreum-web/scripts/sync-data.mjs

      - name: 관리자 화면(Supabase)에 검토 대기로 올리기
        continue-on-error: true # 실패해도 아래 '기록 남기기'는 실행 (그날 확인 기록이 사라지지 않게)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Supabase 설정 없음 - PR로만 남깁니다"; exit 0; fi
          node supabase/seed_programs.mjs
          node supabase/mark_gone.mjs   # 복지로 목록에서 3일 연속 사라진 제도에 '폐지 의심' 표시 (자동 중지는 하지 않음)

      - name: 기록 남기고 PR 열기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pipeline/runs_watch_rules
          git add pipeline/state pipeline/raw pipeline/runs_watch_rules pipeline/local_drafts.json oreum-web/public/data/local_drafts.json oreum-web/public/data/source_gone.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "data: 지자체 제도 변경 확인 $(TZ=Asia/Seoul date +%F)"
          git push origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --base develop --state open --json number -q '.[].number')" ]; then
            gh pr comment "$BRANCH" --body-file pipeline/state/summary.md
          else
            gh pr create --base develop --head "$BRANCH" --title "지자체 제도 변경 확인 (자동)" --body-file pipeline/state/summary.md
          fi
