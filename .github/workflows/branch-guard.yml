name: Branch guard

on:
  pull_request:
    branches: [main]

jobs:
  only-develop:
    name: main에는 develop만 합치기
    runs-on: ubuntu-latest
    steps:
      - name: 보내는 브랜치 확인
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::main에는 develop 브랜치만 PR로 합칠 수 있습니다. 받는 브랜치를 develop으로 바꿔 주세요."
            exit 1
          fi
          echo "develop → main PR 확인"
