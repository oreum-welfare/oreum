name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  check:
    name: 엔진 일치 검사 + 앱 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: oreum-web/package-lock.json

      - name: 파이썬 패키지 설치
        run: pip install "pandas>=2.2"

      - name: 엔진 일치 검사 (rules.py · oreum-web)
        run: |
          python tests/parity_py.py
          node tests/parity.mjs

      - name: 엔진 기대값 · AI 채점기 검사
        run: |
          node tests/engine_checks.mjs
          node tests/admin_checks.mjs
          python tests/grader_checks.py

      - name: React 앱 빌드
        working-directory: oreum-web
        run: |
          npm ci
          npm run build
