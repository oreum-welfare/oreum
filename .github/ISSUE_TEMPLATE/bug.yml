name: 버그 신고
description: 잘못 동작하거나 계산이 이상한 부분을 알려 주세요
title: "[버그] "
labels: ["버그"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 입력한 가구 정보(지역, 나이, 자녀, 소득 등)를 함께 적어 주세요
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
  - type: input
    id: where
    attributes:
      label: 어디서 봤나요
      placeholder: 예) React 버전 /analysis 페이지, 크롬
  - type: textarea
    id: shot
    attributes:
      label: 스크린샷
