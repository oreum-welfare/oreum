name: 기능 요청
description: 새 기능이나 개선을 제안합니다
title: "[기능] "
labels: ["기능"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇을 만들까요
      description: 사용자가 무엇을 할 수 있게 되는지 적어 주세요
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇이 되면 끝인지 체크리스트로
      value: |
        - [ ]
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: [화면(UI), 계산 엔진, 데이터·금액, AI 파이프라인, 문서·발표]
    validations:
      required: true
